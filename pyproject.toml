[project]
name = "flask-buzz"
version = "5.0.0"
description = "Extra bindings on py-buzz specifically for flask apps"
authors = [
    {name = "Tucker Beck", email ="tucker.beck@gmail.com"},
]
readme = "README.md"
license-files = ["LICENSE.md"]

requires-python = ">=3.11"

dependencies = [
    "py-buzz>=9.0",
    "flask>=2.0,<4.0",
]

[project.urls]
homepage = "https://github.com/dusktreader/flask-buzz"
source = "https://github.com/dusktreader/flask-buzz"
changelog = "https://github.com/dusktreader/flask-buzz/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "basedpyright>=1.28.3",
    "ipython>=8.18.1",
    "mkdocstrings[python]>=0.30.0",
    "pyclean>=3.7",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-mock>=3.17",
    "pytest-pretty>=1.3",
    "pytest-random-order>=1.2",
    "ruff>=0.17.4",
    "ty>=0.0.100",
    "typos>=1.52",
    "zensical>=0.1.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "7.4.0"
addopts = [
    "--random-order",
    "--cov=src/flask_buzz",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "--cov-report=xml:.coverage.xml",
    "--junitxml=.junit.xml",
    "--override-ini=junit_family=legacy",
]

[tool.ruff]
line-length = 120
src = ["src/flask_buzz", "tests"]


[tool.hatch.build.targets.wheel]
packages = ["src/flask_buzz"]

[build-system]
requires = ["uv-build>=0.1.0"]
build-backend = "uv_build"
