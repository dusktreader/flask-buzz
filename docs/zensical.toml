[project]
site_name = "flask-buzz"
site_url = "http://dusktreader.github.io/flask-buzz"
repo_url = "https://github.com/dusktreader/flask-buzz"
docs_dir = "source"
site_dir = "site"
dev_addr = "localhost:10000"
watch = ["../src/flask_buzz"]
nav = [
    { "Home" = "index.md" },
    { "Quickstart" = "quickstart.md" },
    { "Features" = "features.md" },
    { "Reference" = "reference.md" },
]

[project.theme]
variant = "classic"
language = "en"
features = [
    "navigation.expand",
    "navigation.footer",
    "navigation.tracking",
    "content.code.copy",
]

[project.theme.font]
code = "Fira Code"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = [".."]

[project.plugins.mkdocstrings.handlers.python.options]
heading_level = 3
show_root_heading = true
separate_signature = true
show_signature_annotations = true
show_source = false
docstring_style = "google"

[project.markdown_extensions]
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = {}
"pymdownx.superfences" = {}
"pymdownx.details" = {}
"pymdownx.blocks.caption" = {}
admonition = {}
attr_list = {}

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
